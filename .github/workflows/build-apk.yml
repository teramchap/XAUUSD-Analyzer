name: Build APK V18

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CHECK REAL XML
        run: |
          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo "===== XML FILE ====="
          ls -l app/src/main/res/layout/activity_main.xml

          echo "===== FIRST BYTES ====="
          xxd -l 32 app/src/main/res/layout/activity_main.xml

          echo "===== FIRST LINE ====="
          head -n 1 app/src/main/res/layout/activity_main.xml

          echo "===== XML PARSE ====="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/res/layout/activity_main.xml")
          print("XML OK")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Analyzer-v18
          path: app/build/outputs/apk/debug/app-debug.apk
