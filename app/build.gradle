plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xau.analyzer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xau.analyzer'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName "6.0"
    }

    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/xau-debug.keystore")
            storePassword "xauanalyzer2026"
            keyAlias "xauanalyzerkey"
            keyPassword "xauanalyzer2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
